<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Governance Ledger</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #111827;
    }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 1.75rem;
    }
    .status-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      min-width: 220px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .status-card h2 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      color: #6b7280;
    }
    .status-card p {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
    }
    .table-wrapper {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }
    th {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      background: #f9fafb;
    }
    td {
      font-size: 0.95rem;
      color: #111827;
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: #4b5563;
    }
    .error-message {
      margin-bottom: 16px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px 16px;
    }
    .muted {
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Pulse Governance Ledger</h1>
        <p class="muted">Polling recent events, health, and circuit breaker status from pulse-proxy.</p>
      </div>
      <div class="status-card">
        <h2>Health</h2>
        <p id="health-status">Loading…</p>
      </div>
      <div class="status-card">
        <h2>Circuit Breaker</h2>
        <p id="cb-status">Loading…</p>
      </div>
    </header>

    <div id="error" class="error-message" style="display:none;"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Kind</th>
            <th>Text</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="events-body">
          <tr><td colspan="4" class="empty-state">Loading events…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const EVENTS_URL = 'https://pulse-proxy-je0p.onrender.com/events'
    const HEALTH_URL = 'https://pulse-proxy-je0p.onrender.com/health'
    const CB_URL = 'https://pulse-proxy-je0p.onrender.com/circuit-breaker/status'

    const healthStatus = document.getElementById('health-status')
    const cbStatus = document.getElementById('cb-status')
    const eventsBody = document.getElementById('events-body')
    const errorBox = document.getElementById('error')

    function renderError(message) {
      if (!errorBox) return
      errorBox.textContent = message
      errorBox.style.display = message ? 'block' : 'none'
    }

    function renderEvents(events) {
      if (!eventsBody) return
      if (!events || events.length === 0) {
        eventsBody.innerHTML = '<tr><td colspan="4" class="empty-state">No events available.</td></tr>'
        return
      }

      eventsBody.innerHTML = events.map(event => {
        const text = event.text ? escapeHtml(event.text) : '<span class="muted">(no text)</span>'
        const data = event.data ? escapeHtml(JSON.stringify(event.data)) : '<span class="muted">(no data)</span>'
        return `
          <tr>
            <td>${escapeHtml(new Date(event.created_at).toLocaleString())}</td>
            <td>${escapeHtml(event.kind)}</td>
            <td>${text}</td>
            <td><pre style="white-space: pre-wrap; max-height: 120px; overflow:auto; margin:0;">${data}</pre></td>
          </tr>`
      }).join('')
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: 'no-store' })
      if (!response.ok) {
        throw new Error(`Request failed with status ${response.status}`)
      }
      return response.json()
    }

    async function refreshStatus() {
      try {
        const [healthData, cbData] = await Promise.all([
          fetchJson(HEALTH_URL),
          fetchJson(CB_URL)
        ])
        console.log('Circuit breaker response:', cbData)
        if (healthStatus) {
          healthStatus.textContent = healthData.ok ? 'OK' : 'Unhealthy'
        }
        if (cbStatus) {
          const state = cbData.state || 'unknown'
          if (state === 'closed') {
            cbStatus.textContent = 'CLOSED ✓'
          } else if (state === 'open') {
            cbStatus.textContent = 'OPEN ⚠️'
          } else {
            cbStatus.textContent = state
          }
        }
        renderError('')
      } catch (err) {
        renderError('Unable to load health or circuit breaker status. ' + err.message)
        if (healthStatus) healthStatus.textContent = 'Error'
        if (cbStatus) cbStatus.textContent = 'Error'
      }
    }

    async function refreshEvents() {
      try {
        const data = await fetchJson(EVENTS_URL)
        renderEvents(data.events || [])
        renderError('')
      } catch (err) {
        renderError('Unable to load events. ' + err.message)
        if (eventsBody) {
          eventsBody.innerHTML = '<tr><td colspan="4" class="empty-state">Unable to load events.</td></tr>'
        }
      }
    }

    refreshStatus()
    refreshEvents()
    setInterval(refreshStatus, 30000)
    setInterval(refreshEvents, 10000)
  </script>
</body>
</html>
